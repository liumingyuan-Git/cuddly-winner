<style>

body { background: #0d0d0f; color: #d8d4c8; font-family: 'Georgia', 'Songti SC', serif; min-height: 100vh; display: flex; justify-content: center; padding: 16px; }

.line-yellow { color: #e8c96a; }
.line-green { color: #7cfc7c; }
.line-red { color: #ef4444; }

#wiki, #guide, #endings { background: #14141a; border: 1px solid #2e2a22; padding: 20px; font-size: 14px; line-height: 1.8; }
#wiki h2, #guide h2, #endings h2 { color: #c9a96a; font-size: 16px; margin: 16px 0 8px; font-weight: normal; border-bottom: 1px solid #2e2a22; padding-bottom: 4px; }

<h2>比努亚村</h2>
<p>莫斯科河沿岸村庄，1812年9月法俄两军在此附近发生遭遇战。村庄位于莫斯科河以南，村外有树林、小溪与俄军临时防线。俄军在此强征民夫，引发村民不满。战后法军在村外修建坟地。</p>
<h2>别列亚外围遭遇战</h2>
<p>1812年9月中旬，法军主力向莫斯科推进期间，俄军后卫部队与地方民团在莫斯科河沿岸组织阻滞作战。法军第17独立团与俄军第23守备团在比努亚村附近发生遭遇战。双方总伤亡约1400人。法军战术胜利，俄军战术撤退。</p>
<h2>俄军猎兵</h2>
<p>由当地猎户与神射手组成，熟悉地形，枪法精准。在比努亚村外围遭遇战中依托树林狙击法军，对法军推进造成极大威胁。战后大部分被俘，少数逃脱后并入其他部队或隐姓埋名。</p>
<h2>比努亚村人民起义</h2>
<p>1812年9月中旬，比努亚村村民因不堪俄军强征劳役，爆发武装起义。起义由当地木匠格里戈里·叶戈罗夫领导，约200余人以草叉、锄头、火枪、土炮为武器。起义军与俄军展开近战，在遭到俄军围堵与法军燃烧弹纵火失控的双重打击下，伤亡惨重。</p>
<h2>无名排长纪念碑</h2>
<p>战后当地村民为一名独冲敌阵的法军步兵排长所立的小型纪念碑。19世纪后期因历史原因被拆除，残件散佚，排长姓名失传。</p>
<h2>圣尼古拉木教堂</h2>
<p>比努亚村及周边村庄共用的东正教教区教堂，木结构，保存有谢苗诺夫副官遗物与教区登记簿。</p>
<h2>埃德蒙·德·瓦雷纳画稿</h2>
<p>法军随军画师埃德蒙·德·瓦雷纳在比努亚村外围遭遇战中绘制的战场素描与速写。原稿为铅笔淡彩，大部分散佚，现存仅有复制品与注记。</p>
<h2>皮埃尔·杜邦日记</h2>
<p>法军一级军士长皮埃尔·杜邦在比努亚村外围遭遇战期间所写的日记，详细记录了战场情况。该日记后经整理出版，成为研究此战的重要口述史料来源之一。</p>
`;

const guideData = `
<h2>游戏规格</h2>
<p>类型：文字经营模拟，事件驱动，多结局。平台：HTML，单文件，浏览器打开即玩。时长：一局约25-40分钟，可反复重玩。</p>
<h2>核心机制</h2>
<p>九项资源：粮食、钱、人、兵、生活资源、军事资源、药品、俄军好感、法军好感、民心。每一项，低也死，高也死。只有维持在中间，才能活。</p>

<h2>攻略</h2>
<p><b>资源维持原则：</b>低于10出事，高于90出事。连续三天低于15或高于85，也出事。</p>
<p><b>优先级：</b>粮 &gt; 民心 &gt; 人 &gt; 钱 &gt; 药 &gt; 生活资源 &gt; 军事资源 &gt; 俄军好感 ≈ 法军好感。</p>
<p><b>常见死因：</b>粮低饿死、民心低暴动、俄军好感低被烧、法军好感低被抢。</p>

<p><b>诀窍：</b>别让任何一项资源连续三天偏离中间太远。</p>
`;

function renderEndings() {
  const unlocked = JSON.parse(localStorage.getItem("binua_endings")) || [];
  let html = "<h2>结局图鉴</h2><p>进度：" + unlocked.length + " / " + ALL_ENDINGS.length + "</p><ul>";
  ALL_ENDINGS.forEach(e => {
    if (unlocked.includes(e)) {
      html += `<li class="unlocked">◆ ${e}</li>`;
    } else {
      html += `<li class="locked">◇ ???</li>`;
    }
  });
  html += "</ul>";
  document.getElementById("endings").innerHTML = html;
}

function unlockEnding(name) {
  let unlocked = JSON.parse(localStorage.getItem("binua_endings")) || [];
  if (!unlocked.includes(name)) {
    unlocked.push(name);
    localStorage.setItem("binua_endings", JSON.stringify(unlocked));
  }
  renderEndings();
}let state = {
  day: 1,
  food: 50, money: 50, people: 50, troops: 50,
  living: 50, military: 50, medicine: 50,
  russian: 50, french: 50, morale: 50,
  gameOver: false,
  cooldowns: {},
  dangerDays: {}
};

const RES_NAMES = {
  food: "粮食", money: "钱", people: "人", troops: "兵",
  living: "生活资源", military: "军事资源", medicine: "药品",
  russian: "俄军好感", french: "法军好感", morale: "民心"
};

const SAFE_MIN = 30;
const SAFE_MAX = 70;

function clampResources() {
  Object.keys(RES_NAMES).forEach(key => {
    if (state[key] > 100) state[key] = 100;
    if (state[key] < 0) state[key] = 0;
  });
}

function renderStatus() {
  const box = document.getElementById("status");
  box.innerHTML = "";
  Object.keys(RES_NAMES).forEach(key => {
    const val = state[key];
    const div = document.createElement("div");
    div.className = "res";
    let cls = "res-val";
    if (val <= 10) cls += " low";
    else if (val >= 90) cls += " high";
    div.innerHTML = `<span class="res-name">${RES_NAMES[key]}</span><span class="${cls}">${val}</span>`;
    box.appendChild(div);
  });
}

function renderEvent(event) {
  const box = document.getElementById("event-text");
  box.innerHTML = "";
  event.lines.forEach(line => {
    const p = document.createElement("div");
    p.className = "line-" + line.type;
    p.textContent = line.text;
    p.style.marginBottom = "6px";
    box.appendChild(p);
  });
  const choicesBox = document.getElementById("choices");
  choicesBox.innerHTML = "";
  event.choices.forEach(c => {
    const btn = document.createElement("button");
    btn.textContent = c.label;
    btn.onclick = () => {
      c.effect(state);
      clampResources();
      state.day++;
      if (checkEnding()) return;
      nextDay();
    };
    choicesBox.appendChild(btn);
  });
}

function saveGame() {
  localStorage.setItem("binua_save", JSON.stringify({
    day: state.day, food: state.food, money: state.money,
    people: state.people, troops: state.troops, living: state.living,
    military: state.military, medicine: state.medicine,
    russian: state.russian, french: state.french, morale: state.morale,
    cooldowns: state.cooldowns, dangerDays: state.dangerDays
  }));
}

function loadGame() {
  const data = localStorage.getItem("binua_save");
  if (!data) return false;
  try {
    const s = JSON.parse(data);
    Object.assign(state, s);
    return true;
  } catch (e) { return false; }

function pickEvent() {
  const all = allEvents.concat(foodEvents, moneyEvents, troopsEvents, livingEvents, militaryEvents, medicineEvents, russianEvents, frenchEvents, moraleEvents, overflowEvents);
  const candidates = all.filter(e => {
    if (state.cooldowns[e.id] && state.day - state.cooldowns[e.id] < (e.cooldown || 3)) return false;
    if (e.condition && !e.condition(state)) return false;
    return true;
  });
  if (candidates.length === 0) return null;
  let total = 0;
  candidates.forEach(e => {
    const w = e.baseWeight + (e.weightModifier ? e.weightModifier(state) : 0);
    e._w = Math.max(1, w);
    total += e._w;
  });
  let roll = Math.random() * total;
  for (const e of candidates) {
    roll -= e._w;
    if (roll <= 0) {
      state.cooldowns[e.id] = state.day;
      return e;
    }
  }
  return candidates[0];
}

function checkEnding() {
  for (const key of Object.keys(RES_NAMES)) {
    if (state[key] <= 10) {
      endGame(RES_NAMES[key] + "崩盘");
      return true;
    }
    if (state[key] >= 90) {
      endGame(RES_NAMES[key] + "爆表");
      return true;
    }
    if (state[key] < 15 || state[key] > 85) {
      state.dangerDays[key] = (state.dangerDays[key] || 0) + 1;
      if (state.dangerDays[key] >= 3) {
        endGame(RES_NAMES[key] + (state[key] < 15 ? "崩盘" : "爆表"));
        return true;
      }
    } else {
      state.dangerDays[key] = 0;
    }
  }
  return false;
}

function endGame(name) {
  state.gameOver = true;
  unlockEnding(name);
  document.getElementById("event-text").innerHTML = `<div class="line-red" style="font-size:18px;">结局：${name}</div>`;
  document.getElementById("choices").innerHTML = "";
  document.getElementById("footer").innerHTML = `<span>游戏结束</span><span>第${state.day}天</span>`;
  let btn = document.createElement("button");
  btn.textContent = "重新开始";
  btn.onclick = resetGame;
  document.getElementById("choices").appendChild(btn);
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>铁血战略 · 二战 & 一战内战</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0b0e14;
            color: #c8d0d8;
            font-family: 'Segoe UI', 'Courier New', monospace;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:12px;
        }
        .app {
            width:100%;
            max-width:1400px;
            background: #141a22;
            border:1px solid #2a3340;
            border-radius:8px;
            padding:16px;
            box-shadow:0 0 30px rgba(0,0,0,0.8);
        }
        .header { display:flex; justify-content:space-between; align-items:center; padding-bottom:10px; border-bottom:2px solid #2a3340; flex-wrap:wrap; gap:8px; }
        .header .title { font-size:1.6rem; font-weight:700; letter-spacing:3px; color:#d4c9a8; text-shadow:0 0 10px rgba(180,150,80,0.2); }
        .header .subtitle { font-size:0.8rem; color:#7a8a9a; letter-spacing:2px; }
        .header .turn-info { background:#1f2833; padding:6px 16px; border-radius:4px; border:1px solid #2a3340; font-size:0.9rem; color:#b0c0d0; }
        .header .turn-info span { color:#e8c86a; font-weight:600; }
        .resource-bar { display:flex; flex-wrap:wrap; gap:10px 24px; background:#1a212a; border:1px solid #2a3340; border-radius:6px; padding:8px 16px; margin:10px 0 8px; }
        .resource-item { display:flex; align-items:center; gap:6px; font-size:0.85rem; color:#b0c0d0; }
        .resource-item .icon { font-size:1.2rem; }
        .resource-item .value { font-weight:600; color:#e8c86a; min-width:28px; }
        .map-wrapper { margin:8px 0; background:#0e1319; border:1px solid #2a3340; border-radius:6px; padding:10px; overflow-x:auto; }
        .map-grid { display:grid; grid-template-columns:repeat(10, minmax(70px, 1fr)); gap:3px; aspect-ratio:10/7; min-height:420px; }
        .cell { background:#161d26; border:1px solid #2a3340; border-radius:3px; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:0.15s; min-height:60px; font-size:0.65rem; color:#5a6a7a; cursor:default; }
        .cell .terrain { font-size:1.4rem; line-height:1; }
        .cell .terrain-label { position:absolute; bottom:2px; right:4px; font-size:0.5rem; opacity:0.5; color:#6a7a8a; }
        .cell .faction-flag { position:absolute; top:2px; left:2px; font-size:0.8rem; opacity:0.9; }
        .cell .unit { position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); background:rgba(10,14,20,0.85); border:2px solid #6a7a8a; border-radius:4px; padding:2px 6px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:0.55rem; font-weight:600; color:#e0e8f0; cursor:pointer; transition:0.15s; min-width:44px; z-index:2; box-shadow:0 2px 8px rgba(0,0,0,0.6); line-height:1.2; }
        .cell .unit:hover { border-color:#b0c0d0; transform:translate(-50%, -50%) scale(1.05); }
        .cell .unit .unit-icon { font-size:1rem; }
        .cell .unit .unit-name { white-space:nowrap; }
        .cell .unit .unit-strength { color:#6a9a7a; }
        .cell .unit.selected { border-color:#e8c86a; box-shadow:0 0 15px rgba(200,180,100,0.3); }
        .cell .unit.attacker { border-color:#d45a5a; }
        .cell .unit.defender { border-color:#5a7ad4; }
        .cell .resource-marker { position:absolute; top:2px; right:2px; font-size:0.7rem; background:rgba(0,0,0,0.6); padding:0 3px; border-radius:3px; }
        .cell.attackable { cursor:pointer; border-color:#d45a5a; box-shadow:inset 0 0 15px rgba(200,60,60,0.2); }
        .cell.attackable:hover { background:#1f2a35; }
        .cell.moveable { cursor:pointer; border-color:#5a8a6a; box-shadow:inset 0 0 15px rgba(60,200,100,0.15); }
        .cell.moveable:hover { background:#1a2a22; }
        .cell.naval-move { cursor:pointer; border-color:#5a7ad4; box-shadow:inset 0 0 15px rgba(60,100,200,0.15); }
        .cell.naval-move:hover { background:#1a2232; }
        .cell.nuclear-target { cursor:pointer; border-color:#ffaa00; box-shadow:inset 0 0 20px rgba(255,170,0,0.3); }
        .cell.nuclear-target:hover { background:#2a2a1a; }
        .info-panel { background:#1a212a; border:1px solid #2a3340; border-radius:6px; padding:12px 16px; margin:8px 0; min-height:70px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 20px; }
        .info-panel .detail { flex:1; }
        .info-panel .detail .row { display:flex; flex-wrap:wrap; gap:4px 16px; font-size:0.85rem; }
        .info-panel .detail .row .label { color:#7a8a9a; }
        .info-panel .detail .row .value { color:#d0d8e0; font-weight:500; }
        .info-panel .action-hint { color:#e8c86a; font-size:0.85rem; margin-top:4px; }
        .controls { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 6px; }
        .btn { padding:6px 14px; border:1px solid #2a3340; border-radius:4px; background:#1f2833; color:#c8d0d8; font-size:0.85rem; cursor:pointer; transition:0.15s; font-family:inherit; letter-spacing:0.5px; }
        .btn:hover { background:#2a3542; border-color:#4a5a6a; }
        .btn.primary { background:#4a5a3a; border-color:#6a8a5a; color:#e8f0d8; }
        .btn.primary:hover { background:#5a6a4a; }
        .btn.danger { background:#5a2a2a; border-color:#8a4a4a; color:#f0d0d0; }
        .btn.danger:hover { background:#6a3a3a; }
        .btn.success { background:#2a4a3a; border-color:#4a8a5a; color:#d0f0d8; }
        .btn.warning { background:#5a4a2a; border-color:#8a7a4a; color:#f0e8d0; }
        .btn:disabled { opacity:0.4; cursor:not-allowed; }
        .btn .badge { background:#3a4a5a; padding:0 6px; border-radius:8px; font-size:0.7rem; }
        .log { background:#0e1319; border:1px solid #2a3340; border-radius:4px; padding:8px 12px; max-height:100px; overflow-y:auto; margin-top:6px; font-size:0.8rem; color:#7a8a9a; }
        .log .entry { padding:2px 0; border-bottom:1px solid #1a222a; }
        .log .entry .time { color:#4a5a6a; margin-right:10px; }
        .modal-overlay { position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center; z-index:999; backdrop-filter:blur(4px); padding:16px; }
        .modal-overlay.show { display:flex; }
        .modal { background:#1a212a; border:2px solid #3a4a5a; border-radius:8px; padding:24px; max-width:850px; width:100%; max-height:85vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.9); animation:modalIn 0.2s ease; }
        @keyframes modalIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
        .modal .close { float:right; background:none; border:none; color:#6a7a8a; font-size:1.5rem; cursor:pointer; }
        .modal h3 { color:#e8c86a; margin-bottom:12px; letter-spacing:1px; }
        .modal h4 { color:#b0c0d0; margin:12px 0 6px; }
        .modal p, .modal li { color:#b0c0d0; line-height:1.6; font-size:0.9rem; }
        .modal .btn-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
        .modal .faction-select { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
        .modal .faction-select label { background:#0e1319; padding:4px 12px; border:1px solid #2a3340; border-radius:4px; cursor:pointer; transition:0.15s; }
        .modal .faction-select label:hover { border-color:#4a5a6a; }
        .modal .faction-select input:checked + span { color:#e8c86a; }
        .modal .era-select { display:flex; gap:12px; flex-wrap:wrap; margin:10px 0; }
        .modal .era-select label { display:flex; align-items:center; gap:4px; cursor:pointer; }
        .modal .year-select { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
        .modal .year-select label { display:flex; align-items:center; gap:4px; cursor:pointer; background:#0e1319; padding:2px 10px; border:1px solid #2a3340; border-radius:4px; }
        .modal .year-select label:hover { border-color:#4a5a6a; }
        .modal .year-select input:checked + span { color:#e8c86a; }
        .modal .support-select { display:flex; gap:16px; margin:12px 0; }
        .modal .support-select label { display:flex; align-items:center; gap:6px; cursor:pointer; }
        @media (max-width:768px) { .app { padding:10px; } .map-grid { grid-template-columns:repeat(10, minmax(48px,1fr)); min-height:300px; gap:2px; } .cell { min-height:44px; font-size:0.5rem; } .cell .terrain { font-size:1rem; } .cell .unit { padding:1px 4px; min-width:32px; font-size:0.45rem; } .cell .unit .unit-icon { font-size:0.7rem; } .cell .unit .unit-name { display:none; } .header .title { font-size:1.2rem; } .resource-bar { gap:6px 12px; } .resource-item { font-size:0.7rem; } .btn { padding:4px 10px; font-size:0.75rem; } }
        @media (max-width:480px) { .map-grid { grid-template-columns:repeat(10, minmax(36px,1fr)); min-height:220px; } .cell { min-height:32px; border-radius:2px; } .cell .terrain { font-size:0.8rem; } .cell .unit { min-width:24px; padding:1px 2px; } .cell .unit .unit-icon { font-size:0.6rem; } .cell .unit .unit-strength { display:none; } .controls .btn { font-size:0.65rem; padding:2px 6px; } }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="header">
        <div>
            <div class="title">⚔️ 铁血战略 · 完全版</div>
            <div class="subtitle" id="eraSubtitle">请开始游戏</div>
        </div>
        <div class="turn-info">
            🗓️ 回合 <span id="turnNum">0</span> &nbsp;|&nbsp; 📌 <span id="phaseName">部署</span>
        </div>
    </div>
    <div class="resource-bar" id="resourceBar"></div>
    <div class="map-wrapper">
        <div class="map-grid" id="mapGrid"></div>
    </div>
    <div class="info-panel" id="infoPanel">
        <div class="detail">
            <div class="row"><span class="label">状态：</span><span class="value" id="statusText">选择部队或操作</span></div>
            <div class="action-hint" id="actionHint">点击部队选择，使用下方按钮</div>
        </div>
    </div>
    <div class="controls" id="controls">
        <button class="btn" id="btnSelect" disabled>选择</button>
        <button class="btn" id="btnMove" disabled>调动</button>
        <button class="btn btn-danger" id="btnAttack" disabled>进攻</button>
        <button class="btn btn-primary" id="btnTech">🔬 科技</button>
        <button class="btn btn-primary" id="btnProduction">🏭 生产</button>
        <button class="btn btn-warning" id="btnDiplo">🤝 外交</button>
        <button class="btn btn-warning" id="btnSpy">🕵️ 间谍</button>
        <button class="btn btn-success" id="btnEndTurn">结束回合</button>
        <button class="btn" id="btnReset" style="margin-left:auto;">🔄 新局</button>
    </div>
    <div class="log" id="logPanel"></div>
</div>

<!-- 设置弹窗 -->
<div class="modal-overlay show" id="setupModal">
    <div class="modal">
        <h3>⚙️ 铁血战略 · 设置</h3>
        <p>选择模式与剧本。</p>
        <div class="era-select">
            <label><input type="radio" name="mode" value="ww2" checked> 二战</label>
            <label><input type="radio" name="mode" value="ww1"> 一战 · 沙俄内战</label>
        </div>
        <div id="modeOptions">
            <!-- 由JS动态填充 -->
        </div>
        <div class="faction-select" id="factionCheckboxes"></div>
        <div id="supportOptions" style="display:none;">
            <p>选择您支持的一方（仅限一战内战模式）：</p>
            <div class="support-select">
                <label><input type="radio" name="support" value="white"> 🏴 白军（沙俄）</label>
                <label><input type="radio" name="support" value="red"> 🚩 红军（苏俄）</label>
            </div>
        </div>
        <div class="btn-row">
            <button class="btn primary" id="startGameBtn">🚀 开始战争</button>
        </div>
        <div style="margin-top:12px;background:#0e1319;padding:10px;border-radius:4px;font-size:0.8rem;color:#7a8a9a;">
            <strong style="color:#b0c0d0;">说明：</strong> 二战模式分欧洲/亚洲战场，常规玩法。一战模式为1916-1918沙俄内战，支持一方并派遣远征军。
        </div>
    </div>
</div>

<!-- 战斗弹窗 -->
<div class="modal-overlay" id="battleModal">
    <div class="modal">
        <button class="close" onclick="closeBattleModal()">&times;</button>
        <h3 id="battleTitle">⚡ 战斗报告</h3>
        <div id="battleContent"></div>
        <div class="btn-row"><button class="btn primary" onclick="closeBattleModal()">确认</button></div>
    </div>
</div>

<!-- 科技弹窗 -->
<div class="modal-overlay" id="techModal">
    <div class="modal">
        <button class="close" onclick="closeTechModal()">&times;</button>
        <h3>🔬 科技研发</h3>
        <div id="techContent"></div>
        <div class="btn-row"><button class="btn" onclick="closeTechModal()">关闭</button></div>
    </div>
</div>

<!-- 生产弹窗 -->
<div class="modal-overlay" id="prodModal">
    <div class="modal">
        <button class="close" onclick="closeProdModal()">&times;</button>
        <h3 id="prodTitle">🏭 军事生产</h3>
        <div id="prodContent"></div>
        <div class="btn-row"><button class="btn" onclick="closeProdModal()">关闭</button></div>
    </div>
</div>

<!-- 外交弹窗 -->
<div class="modal-overlay" id="diploModal">
    <div class="modal">
        <button class="close" onclick="closeDiploModal()">&times;</button>
        <h3>🤝 外交关系</h3>
        <div id="diploContent"></div>
        <div class="btn-row"><button class="btn" onclick="closeDiploModal()">关闭</button></div>
    </div>
</div>

<!-- 间谍弹窗 -->
<div class="modal-overlay" id="spyModal">
    <div class="modal">
        <button class="close" onclick="closeSpyModal()">&times;</button>
        <h3>🕵️ 间谍行动</h3>
        <div id="spyContent"></div>
        <div class="btn-row"><button class="btn" onclick="closeSpyModal()">关闭</button></div>
    </div>
</div>

<!-- 核打击确认弹窗 -->
<div class="modal-overlay" id="nukeModal">
    <div class="modal">
        <button class="close" onclick="closeNukeModal()">&times;</button>
        <h3>☢️ 核打击确认</h3>
        <div id="nukeContent"></div>
        <div class="btn-row">
            <button class="btn danger" id="nukeConfirmBtn">💥 执行核打击</button>
            <button class="btn" onclick="closeNukeModal()">取消</button>
        </div>
    </div>
</div>

function updateUI() {

    renderResources();
    renderTurn();
    renderControls();
    updateInfo();

function renderMap() {
    mapGrid.innerHTML = '';
    for(let y=0; y<MAP_H; y++){
        for(let x=0; x<MAP_W; x++){
            const cell = G.map[y][x];
            const div = document.createElement('div');
            div.className = 'cell';
            div.dataset.x = x;
            div.dataset.y = y;

            const terrain = TERRAIN[cell.terrain] || TERRAIN[0];
            div.innerHTML = `<div class="terrain">${terrain.icon}</div>`;
            if (terrain.label) {
                div.innerHTML += `<div class="terrain-label">${terrain.label}</div>`;
            }
            if (cell.resources && cell.resources.length) {
                const marker = document.createElement('div');
                marker.className = 'resource-marker';
                marker.textContent = cell.resources.includes('industry') ? '🏭' : (cell.resources.includes('oil') ? '⛽' : '');
                div.appendChild(marker);
            }
            if (cell.owner) {
                let display = cell.owner;
                let color = '#888';
                if (cell.owner === 'white') { display = '⚪'; color = '#e8c86a'; }
                else if (cell.owner === 'red') { display = '🔴'; color = '#dc2626'; }
                else {
                    const f = G.factionData[cell.owner];
                    if (f) { display = f.icon; color = f.color; }
                }
                const flagDiv = document.createElement('div');
                flagDiv.className = 'faction-flag';
                flagDiv.textContent = display;
                flagDiv.style.color = color;
                div.appendChild(flagDiv);
            }

            const unitsHere = G.units.filter(u => u.x === x && u.y === y && u.strength > 0);
            if (unitsHere.length) {
                const unit = unitsHere[0];
                const f = G.factionData[unit.faction] || { icon:'⚔️', color:'#aaa' };
                const def = UNIT_TYPES[unit.type] || UNIT_TYPES['步兵师'];
                const unitDiv = document.createElement('div');
                unitDiv.className = 'unit';
                if (G.selectedUnitId === unit.id) unitDiv.classList.add('selected');
                unitDiv.style.borderColor = (unit.faction === 'white' || unit.faction === 'red') ? '#e8c86a' : f.color;
                unitDiv.innerHTML = `
                    <span class="unit-icon">${def.icon}</span>
                    <span class="unit-name">${unit.name}</span>
                    <span class="unit-strength">${Math.round(unit.strength)}%</span>
                `;
                unitDiv.dataset.unitId = unit.id;
                unitDiv.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectUnit(unit.id);
                });
                div.appendChild(unitDiv);
                if (unitsHere.length > 1) {
                    const countDiv = document.createElement('div');
                    countDiv.style.cssText = 'position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,0.6);border-radius:3px;padding:0 4px;font-size:0.5rem;color:#aaa;';
                    countDiv.textContent = `+${unitsHere.length-1}`;
                    div.appendChild(countDiv);
                }
            }

            // 攻击/移动高亮
            if (G.phase === 'combat' && G.selectedUnitId) {
                const sel = G.units.find(u => u.id === G.selectedUnitId);
                if (sel) {
                    const dist = Math.abs(sel.x - x) + Math.abs(sel.y - y);
                    if (dist <= 2 && dist > 0) {
                        const target = G.units.find(u => u.x === x && u.y === y && u.faction !== sel.faction && u.strength > 0);
                        if (target) {
                            div.classList.add('attackable');
                            div.addEventListener('click', () => {
                                if (G.phase === 'combat') executeAttack(sel.id, target.id);
                            });
                        }
                    }
                }
            }
            if (G.phase === 'movement' && G.selectedUnitId) {
                const sel = G.units.find(u => u.id === G.selectedUnitId);
                if (sel) {
                    const dist = Math.abs(sel.x - x) + Math.abs(sel.y - y);
                    if (dist <= 2 && dist > 0) {
                        const hasUnit = G.units.some(u => u.x === x && u.y === y && u.strength > 0);

function selectUnit(id) {

    if (!['planning','movement','combat'].includes(G.phase)) return;
    const unit = G.units.find(u => u.id === id);
    if (!unit || unit.strength <= 0) return;
    G.selectedUnitId = id;
    updateUI();
}

function moveUnit(id, tx, ty) {
    if (G.gameOver) return;
    const unit = G.units.find(u => u.id === id);
    if (!unit || unit.strength <= 0) return;
    const occupied = G.units.some(u => u.x === tx && u.y === ty && u.strength > 0);
    if (occupied) { addLog('❌ 目标被占据'); return; }
    const dist = Math.abs(unit.x - tx) + Math.abs(unit.y - ty);
    if (dist > 2) { addLog('❌ 距离过远'); return; }
    const terrain = TERRAIN[G.map[ty][tx].terrain];
    let canMove = false;
    if (unit.domain === 'land' && terrain.domain === 'land') canMove = true;
    else if (unit.domain === 'sea' && (terrain.domain === 'sea' || G.map[ty][tx].terrain === 4)) canMove = true;
    else if (unit.domain === 'air') canMove = true;
    if (!canMove) { addLog(`❌ ${unit.domain} 无法移动到该地形`); return; }

    const res = G.resources[unit.faction];
    if (res && res.oil < 1) { addLog('❌ 石油不足'); return; }
    if (res) res.oil -= 1;

    const oldX=unit.x, oldY=unit.y;
    unit.x = tx; unit.y = ty;
    G.map[ty][tx].owner = unit.faction;
    const others = G.units.filter(u => u.id !== id && u.x === oldX && u.y === oldY && u.strength > 0);
    if (others.length === 0) G.map[oldY][oldX].owner = null;

    addLog(`🚚 ${unit.name} 移动到 (${tx+1},${ty+1})`);
    G.selectedUnitId = null;
    G.phase = 'combat';
    updateUI();
    updateInfo('部队已移动，可进攻或结束回合');
}

function executeAttack(aId, dId) {
    if (G.gameOver) return;
    const attacker = G.units.find(u => u.id === aId);
    const defender = G.units.find(u => u.id === dId);
    if (!attacker || !defender || attacker.strength<=0 || defender.strength<=0) return;
    const dist = Math.abs(attacker.x - defender.x) + Math.abs(attacker.y - defender.y);
    if (dist > 2) return;

    const aDef = UNIT_TYPES[attacker.type] || UNIT_TYPES['步兵师'];
    const dDef = UNIT_TYPES[defender.type] || UNIT_TYPES['步兵师'];
    const bonusA = G.factionBonus[attacker.faction] || {};
    const bonusD = G.factionBonus[defender.faction] || {};

    let atkBonus=0, defBonus=0;
    if (attacker.type === '步兵师') { atkBonus += (bonusA.inf_atk||0); defBonus += (bonusA.inf_def||0); }
    else if (attacker.type === '装甲师') { atkBonus += (bonusA.arm_atk||0); defBonus += (bonusA.arm_def||0); }
    else if (attacker.type === '炮兵师') { atkBonus += (bonusA.art_atk||0); }
    if (defender.type === '步兵师') { defBonus += (bonusD.inf_def||0); }
    else if (defender.type === '装甲师') { defBonus += (bonusD.arm_def||0); }

    let aMod=1, dMod=1;
    if (attacker.type === '装甲师' && defender.type === '步兵师') aMod = 1.3;
    if (attacker.type === '反坦克师' && defender.type === '装甲师') aMod = 1.4;
    if (attacker.type === '炮兵师' && defender.type === '步兵师') aMod = 1.2;
    if (attacker.domain === 'air' && defender.domain === 'land') aMod = 1.2;

    const terrain = TERRAIN[G.map[defender.y][defender.x].terrain] || TERRAIN[0];
    const tDef = 1 + terrain.def;

    const atkPow = (aDef.attack + atkBonus) * (attacker.strength/100) * aMod * (0.85 + Math.random()*0.3);
    const defPow = (dDef.defense + defBonus) * (defender.strength/100) * tDef * (0.85 + Math.random()*0.3);

    let aLoss = Math.round(20 * (defPow / (atkPow + 1)) * (0.5 + Math.random()*0.5));
    let dLoss = Math.round(20 * (atkPow / (defPow + 1)) * (0.5 + Math.random()*0.5));
    aLoss = Math.min(aLoss, attacker.strength * 0.6);
    dLoss = Math.min(dLoss, defender.strength * 0.6);
    aLoss = Math.max(5, aLoss);
    dLoss = Math.max(5, dLoss);

    attacker.strength = Math.max(0, attacker.strength - aLoss);
    defender.strength = Math.max(0, defender.strength - dLoss);

    const aWin = defender.strength <= 0;
    const dWin = attacker.strength <= 0;

    if (attacker.strength <= 0) addLog(`💀 ${attacker.name} 被消灭`);
    if (defender.strength <= 0) {
        addLog(`💀 ${defender.name} 被消灭`);
        G.map[defender.y][defender.x].owner = attacker.faction;
        addLog(`🏴 ${attacker.name} 占领 (${defender.x+1},${defender.y+1})`);
    }

    const title = aWin ? '🏆 进攻胜利' : (dWin ? '💥 防御胜利' : '⚖️ 战平');
    const content = `
        <p><strong>攻击方：</strong>${attacker.name}</p>
        <p><strong>防御方：</strong>${defender.name}</p>
        <p><strong>攻击方损失：</strong>${Math.round(aLoss)}% (剩余 ${Math.round(attacker.strength)}%)</p>
        <p><strong>防御方损失：</strong>${Math.round(dLoss)}% (剩余 ${Math.round(defender.strength)}%)</p>
        <p><strong>结果：</strong>${title}</p>
        <p style="font-size:0.8rem;color:#7a8a9a;">地形: ${terrain.label} +${Math.round(tDef*100-100)}%</p>
    `;
    battleTitle.textContent = title;
    battleContent.innerHTML = content;
    battleModal.classList.add('show');

    G.units = G.units.filter(u => u.strength > 0);
    if (checkVictory()) { G.phase='end'; updateUI(); return; }

    G.selectedUnitId = null;
    G.phase = 'end';
    updateUI();
    updateInfo('战斗结束，点击「结束回合」');
}
function closeBattleModal() { battleModal.classList.remove('show'); }

function researchTech(techId) {
    const tech = TECH_TREE.find(t => t.id === techId);
    if (!tech) return;
    let target = null;
    if (G.selectedUnitId) {
        const u = G.units.find(u => u.id === G.selectedUnitId);

    }

    const res = G.resources[target];
    if (!res || res.tech < tech.cost) { alert('科技点不足'); return; }

    addLog(`🔬 ${G.factionData[target].name} 研发 ${tech.name}`);

    const def = UNIT_TYPES[type];
    if (!def) return;
    let target = null;
    if (G.selectedUnitId) {
        const u = G.units.find(u => u.id === G.selectedUnitId);
        if (u) target = u.faction;
    }
    if (!target) target = G.factions[0];
    const res = G.resources[target];
    if (!res) return;
    const cost = def.cost;
    for (let k in cost) {
        if ((res[k] || 0) < cost[k]) { alert(`资源 ${k} 不足`); return; }
    }
    for (let k in cost) res[k] -= cost[k];
    if (!G.productionQueue[target]) G.productionQueue[target] = [];
    if (G.productionQueue[target].length >= 3) { alert('队列已满'); return; }
    G.productionQueue[target].push({ type, turnsLeft: 1 });
    addLog(`🏭 ${G.factionData[target].name} 开始生产 ${type}`);
    closeProdModal();
    updateUI();
}

// 一战远征军和援助
function dispatchExpedition() {
    const res = G.resources['player'];
    if (!res || res.industry<20 || res.steel<10 || res.oil<5) { alert('资源不足'); return; }
    res.industry -= 20; res.steel -= 10; res.oil -= 5;
    const side = G.supportChoice;
    let coords = [];
    for(let y=0; y<MAP_H; y++) for(let x=0; x<MAP_W; x++) {
        if (G.map[y][x].owner === side) coords.push({x,y});
    }
    if (coords.length === 0) coords = [{x:5,y:2},{x:6,y:2},{x:7,y:2}];
    const pos = coords[rand(0, coords.length-1)];
    const unit = {
        id: ++G.unitIdCounter,
        faction: side,
        type: '装甲师',
        x: pos.x, y: pos.y,
        strength: 90,
        maxStrength: 100,
        name: `远征军${G.unitIdCounter}`,
        experience: 0,
        domain: 'land'
    };
    G.units.push(unit);
    G.map[pos.y][pos.x].owner = side;
    addLog(`🚀 派遣远征军至 (${pos.x+1},${pos.y+1}) 支持 ${side==='white'?'白军':'红军'}`);
    closeProdModal();
    updateUI();
}
function sendAid(type) {
    const res = G.resources['player'];
    if (!res) return;
    if (type === 'ammo' && res.industry >= 10) {
        res.industry -= 10;
        G.aidPoints[G.supportChoice] += 5;
        addLog(`📦 向 ${G.supportChoice} 运送弹药，援助+5`);
    } else if (type === 'supply' && res.steel >= 10 && res.oil >= 5) {
        res.steel -= 10; res.oil -= 5;
        G.aidPoints[G.supportChoice] += 5;
        addLog(`🍞 向 ${G.supportChoice} 运送补给，援助+5`);
    } else { alert('资源不足'); return; }
    updateUI();
}

            html += `<button class="btn btn-sm" onclick="spyMission('${fid}','${other}','sabotage')">破坏工业 (10🔬)</button>`;
            html += `<button class="btn btn-sm" onclick="spyMission('${fid}','${other}','assassinate')">暗杀将领 (20🔬)</button>`;
            html += `<button class="btn btn-sm" onclick="spyMission('${fid}','${other}','reveal')">情报 (5🔬)</button>`;
        });
        html += '</div>';
    });
    spyContent.innerHTML = html;
    spyModal.classList.add('show');
}
function spyMission(from, to, type) {
    const res = G.resources[from];
    if (!res) return;
    let cost = 0;
    switch(type) {
        case 'steal': cost=15; break;
        case 'sabotage': cost=10; break;
        case 'assassinate': cost=20; break;
        case 'reveal': cost=5; break;
    }
    if (res.tech < cost) { alert('科技点不足'); return; }
    res.tech -= cost;
    let success = Math.random() < 0.5 + (res.tech/200);
    let msg = '';
    if (success) {
        switch(type) {
            case 'steal': {
                const available = TECH_TREE.filter(t => !G.techResearched[from]?.has(t.id) && G.techResearched[to]?.has(t.id));
                if (available.length) {
                    const tech = available[rand(0, available.length-1)];
                    G.techResearched[from].add(tech.id);
                    tech.effect(G.factionBonus[from]);
                    msg = `偷取科技 ${tech.name} 成功！`;
                } else { msg = '无可偷科技'; }
                break;
            }
            case 'sabotage': {
                G.resources[to].industry = Math.max(0, G.resources[to].industry - 20);
                msg = '破坏工业成功！';
                break;
            }
            case 'assassinate': {
                const units = G.units.filter(u => u.faction === to && u.strength > 0);
                if (units.length) {
                    const u = units[rand(0, units.length-1)];
                    u.strength = Math.max(0, u.strength - 50);
                    if (u.strength <= 0) { G.units = G.units.filter(unit => unit.id !== u.id); msg = `暗杀 ${u.name} 成功！`; }
                    else { msg = `暗杀 ${u.name} 使其重伤！`; }
                } else { msg = '无目标可暗杀'; }
                break;
            }
            case 'reveal': {
                const positions = G.units.filter(u => u.faction === to && u.strength > 0)
                    .map(u => `${u.name} (${u.x+1},${u.y+1})`).join('; ');
                msg = `情报获取：${positions}`;
                break;
            }
        }
    } else { msg = '任务失败'; }
    addLog(`🕵️ ${G.factionData[from].name} 对 ${G.factionData[to].name} 执行 ${type}：${msg}`);
    closeSpyModal();
    updateUI();
}
function closeSpyModal() { spyModal.classList.remove('show'); }

// ----- 回合管理 -----
function endTurn() {
    if (G.gameOver) { resetGame(); return; }
    consumeSupplies();
    processProduction();
    produceResources();

    // 二战经济胜利检查
    if (G.mode === 'ww2') {
        G.factions.forEach(fid => {
            if (G.resources[fid].industry >= 1000) {
                G.gameOver = true; G.winner = fid; G.victoryCondition = 'economy';
                addLog(`🏆 ${G.factionData[fid].name} 达成经济胜利！`);
            }
        });
        if (G.gameOver) { updateUI(); updateInfo(); return; }
    }

    // 一战内战胜利检查
    if (G.mode === 'ww1') {
        let whiteCount = 0, redCount = 0;
        for(let y=0; y<MAP_H; y++) for(let x=0; x<MAP_W; x++) {
            if (G.map[y][x].owner === 'white') whiteCount++;
            if (G.map[y][x].owner === 'red') redCount++;
        }
        if (whiteCount === 0 && redCount > 0) {
            G.gameOver = true;
            G.winner = G.supportChoice === 'red' ? 'player' : null;
            G.victoryCondition = '内战胜利';
            addLog(`🏆 ${G.supportChoice==='red'?'红军':'白军'} 赢得内战！您获胜！`);
        } else if (redCount === 0 && whiteCount > 0) {
            G.gameOver = true;
            G.winner = G.supportChoice === 'white' ? 'player' : null;
            G.victoryCondition = '内战胜利';
            addLog(`🏆 ${G.supportChoice==='white'?'白军':'红军'} 赢得内战！您获胜！`);
        }
        if (G.gameOver) { updateUI(); updateInfo(); return; }
    }

    G.turn++;
    G.phase = 'planning';
    G.selectedUnitId = null;
    G.units.forEach(u => {
        if (u.strength > 0 && u.strength < u.maxStrength) {
            u.strength = Math.min(u.maxStrength, u.strength + rand(3,8));
        }
    });
    addLog(`📅 第 ${G.turn} 回合开始。`);
    updateUI();
    updateInfo('新回合，请行动。');
    checkVictory();
    // AI回合
    aiTurn();
}

function consumeSupplies() {
    G.units.forEach(u => {
        if (u.strength <= 0) return;
        const res = G.resources[u.faction];
        if (!res) return;
        const def = UNIT_TYPES[u.type] || UNIT_TYPES['步兵师'];
        const cost = def.cost || {};
        let need = { industry:1, oil:1, steel:1 };
        for (let k in need) {
            need[k] += Math.round((cost[k] || 0) * 0.2);
        }
        const bonus = G.factionBonus[u.faction] || {};
        const discount = bonus.logistics || 0;
        for (let k in need) need[k] = Math.max(0, Math.round(need[k] * (1 - discount)));
        let shortage = false;
        for (let k in need) {
            if ((res[k] || 0) < need[k]) shortage = true;
        }
        if (shortage) {
            u.strength = Math.max(10, u.strength - rand(5,15));
            addLog(`⚠️ ${u.name} 补给不足，战力下降！`);
        } else {
            for (let k in need) res[k] -= need[k];
        }
    });
}

function processProduction() {
    if (G.mode === 'ww1') return; // 一战无生产队列
    G.factions.forEach(fid => {
        const q = G.productionQueue[fid] || [];
        if (q.length === 0) return;
        const item = q[0];
        item.turnsLeft--;
        if (item.turnsLeft <= 0) {
            const f = G.factionData[fid];
            const cap = f.capital;
            let x = cap ? cap[0] : rand(0, MAP_W-1);
            let y = cap ? cap[1] : rand(0, MAP_H-1);
            const def = UNIT_TYPES[item.type] || UNIT_TYPES['步兵师'];
            const domain = def.domain || 'land';
            let found = false;
            for (let dy=-2; dy<=2 && !found; dy++) {
                for (let dx=-2; dx<=2 && !found; dx++) {
                    const nx = x+dx, ny = y+dy;
                    if (nx>=0 && nx<MAP_W && ny>=0 && ny<MAP_H) {
                        const terrain = TERRAIN[G.map[ny][nx].terrain];
                        let valid = false;
                        if (domain === 'land' && terrain.domain === 'land') valid = true;
                        else if (domain === 'sea' && (terrain.domain === 'sea' || G.map[ny][nx].terrain === 4)) valid = true;
                        else if (domain === 'air') valid = true;
                        if (valid && !G.units.some(u => u.x===nx && u.y===ny && u.strength>0)) {
                            x=nx; y=ny; found=true;
                        }
                    }
                }
            }
            if (!found) {
                const pool = [];
                for (let yy=0; yy<MAP_H; yy++) for (let xx=0; xx<MAP_W; xx++) {
                    const terrain = TERRAIN[G.map[yy][xx].terrain];
                    let valid = false;
                    if (domain === 'land' && terrain.domain === 'land') valid = true;
                    else if (domain === 'sea' && (terrain.domain === 'sea' || G.map[yy][xx].terrain === 4)) valid = true;
                    else if (domain === 'air') valid = true;
                    if (valid && !G.units.some(u => u.x===xx && u.y===yy && u.strength>0)) pool.push({x:xx,y:yy});
                }
                if (pool.length) { const p=pool[rand(0,pool.length-1)]; x=p.x; y=p.y; }
            }
            const unit = {
                id: ++G.unitIdCounter,
                faction: fid,
                type: item.type,
                x, y,
                strength: 90,
                maxStrength: 100,
                name: `${f.short}新编${item.type.replace('师','')}`,
                experience: 0,
                domain: domain
            };
            G.units.push(unit);
            G.map[y][x].owner = fid;
            addLog(`✅ ${G.factionData[fid].name} 生产完成：${item.type}`);
            q.shift();
        }
    });
}

function produceResources() {
    if (G.mode === 'ww1') {
        // 玩家资源自动恢复
        const res = G.resources['player'];
        if (res) {
            res.industry += 5 + rand(0,3);
            res.oil += 3 + rand(0,2);
            res.steel += 4 + rand(0,3);
            res.manpower += 2 + rand(0,2);
            res.tech += 1;
        }
        return;
    }
    G.factions.forEach(fid => {
        const res = G.resources[fid];
        if (!res) return;
        let baseInd = 5 + rand(0,3), baseOil = 3 + rand(0,2), baseSteel = 5 + rand(0,3), baseMan = 4 + rand(0,2), baseTech = 1 + rand(0,1);
        const bonus = G.factionBonus[fid] || {};
        if (bonus.ind_prod) baseInd += bonus.ind_prod;
        let indCount=0, portCount=0;
        for (let y=0; y<MAP_H; y++) for (let x=0; x<MAP_W; x++) {
            const cell = G.map[y][x];
            if (cell.owner === fid) {
                if (cell.resources.includes('industry')) indCount++;
                if (cell.resources.includes('oil')) portCount++;
            }
        }
        baseInd += indCount * 3;
        baseOil += portCount * 2;
        res.industry += baseInd;
        res.oil += baseOil;
        res.steel += baseSteel;
        res.manpower += baseMan;
        res.tech += baseTech;
    });
}

function checkVictory() {
    const active = new Set();
    G.units.forEach(u => { if (u.strength > 0) active.add(u.faction); });
    if (active.size <= 1 && G.units.length > 0) {
        const winner = active.values().next().value;
        G.gameOver = true; G.winner = winner; G.victoryCondition = 'military';
        addLog(`🏆 ${G.factionData[winner]?.name||winner} 取得军事胜利！`);
        updateUI(); updateInfo(); return true;
    }
    if (G.units.length === 0) {
        G.gameOver = true; G.winner = null; G.victoryCondition = 'draw';
        addLog('⚖️ 同归于尽，平局。');
        updateUI(); updateInfo(); return true;
    }
    return false;
}

// ----- AI 行动 -----
function aiTurn() {
    if (G.gameOver || G.mode === 'ww1') {
        // 一战AI：白军和红军自动攻击
        if (G.mode === 'ww1' && !G.gameOver) {
            // 简单AI：各自寻找最近的敌方
            ['white','red'].forEach(side => {
                const units = G.units.filter(u => u.faction === side && u.strength > 0);
                units.forEach(unit => {
                    let minDist = 999, target = null;
                    G.units.forEach(other => {
                        if (other.faction === side || other.strength <= 0) return;
                        const d = Math.abs(unit.x - other.x) + Math.abs(unit.y - other.y);
                        if (d < minDist && d <= 3) { minDist = d; target = other; }
                    });
                    if (target) {
                        if (minDist <= 2) {
                            executeAttack(unit.id, target.id);
                        } else if (minDist <= 3) {
                            const dx = Math.sign(target.x - unit.x);
                            const dy = Math.sign(target.y - unit.y);
                            const nx = unit.x + dx, ny = unit.y + dy;
                            if (nx>=0 && nx<MAP_W && ny>=0 && ny<MAP_H) {
                                const occupied = G.units.some(u => u.x===nx && u.y===ny && u.strength>0);
                                if (!occupied) {
                                    const terrain = TERRAIN[G.map[ny][nx].terrain];
                                    if (terrain.domain === 'land') moveUnit(unit.id, nx, ny);
                                }
                            }
                        }
                    }
                });
            });
        }
        return;
    }
    // 二战AI
    G.factions.forEach(fid => {
        const units = G.units.filter(u => u.faction === fid && u.strength > 0);
        if (units.length === 0) return;
        units.forEach(unit => {
            let minDist = 999, target = null;
            G.units.forEach(other => {
                if (other.faction === fid || other.strength <= 0) return;
                const d = Math.abs(unit.x - other.x) + Math.abs(unit.y - other.y);
                if (d < minDist && d <= 3) { minDist = d; target = other; }
            });
            if (target) {
                if (minDist <= 2) {
                    executeAttack(unit.id, target.id);
                } else if (minDist <= 3) {
                    const dx = Math.sign(target.x - unit.x);
                    const dy = Math.sign(target.y - unit.y);
                    const nx = unit.x + dx, ny = unit.y + dy;
                    if (nx>=0 && nx<MAP_W && ny>=0 && ny<MAP_H) {
                        const occupied = G.units.some(u => u.x===nx && u.y===ny && u.strength>0);
                        if (!occupied) {
                            const terrain = TERRAIN[G.map[ny][nx].terrain];
                            let can = false;
                            if (unit.domain === 'land' && terrain.domain === 'land') can = true;
                            else if (unit.domain === 'sea' && (terrain.domain === 'sea' || G.map[ny][nx].terrain === 4)) can = true;
                            else if (unit.domain === 'air') can = true;
                            if (can) moveUnit(unit.id, nx, ny);
                        }
                    }
                }
            }
        });
    });
    checkVictory();
}

// ----- 重置 -----
function resetGame() {
    if (!confirm('重新开局？')) return;
    G.factions = [];
    G.turn = 0;
    G.phase = 'planning';
    G.resources = {};
    G.units = [];
    G.map = [];
    G.selectedUnitId = null;
    G.gameOver = false;
    G.winner = null;
    G.log = [];
    G.techResearched = {};
    G.factionBonus = {};
    G.productionQueue = {};
    G.unitIdCounter = 0;
    G.victoryCondition = null;
    G.diplomacy = {};
    G.nuclearPowers = new Set();
    G.nukeReady = {};
    G.aidPoints = { white:0, red:0 };
    G.factionSupport = {};
    ['battleModal','techModal','prodModal','diploModal','spyModal','nukeModal'].forEach(id => $(id).classList.remove('show'));
    // 重新打开设置
    setupModal.classList.add('show');
    initSetup();
}

btnSelect.addEventListener('click', ()=>{ if(G.phase==='planning') updateInfo('点击地图上的部队选择。'); });

        G.phase = 'movement';

});

initSetup();
</script>

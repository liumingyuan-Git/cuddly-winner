    choices: [
      { label: "我们必须同法国人合作", next: "cooperateYes" },
      { label: "我们需要保持独立", next: "cooperateNo" }
    ]
  },
  cooperateYes: {
    text: "你与法军合作。\n\n你成了傀儡，剥削曾经的战友。",
    ending: "老来多惊梦，似有献刀人"
  },
  cooperateNo: {
    text: "你保持独立。法军镇压你们。",
    choices: [
      { label: "我们还是必须屈服", next: "cooperateYes" },
      { label: "在莫斯科森林里打游击", next: "guerrilla" }
    ]
  },
  guerrilla: {
    text: "你带残部退入森林，坚持游击。\n\n你们没有被历史记住，但你们确实是历史的一部分。",
    ending: "人民战争"
  }
};function unlockEnding(name) {
  let unlocked = JSON.parse(localStorage.getItem("achievements")) || [];
  if (!unlocked.includes(name)) {
    unlocked.push(name);
    localStorage.setItem("achievements", JSON.stringify(unlocked));
  }
}

function showAchievements() {
  let unlocked = JSON.parse(localStorage.getItem("achievements")) || [];
  let list = document.getElementById("ending-list");
  list.innerHTML = "";
  allEndings.forEach(e => {
    let li = document.createElement("li");
    if (unlocked.includes(e)) {
      li.textContent = "◆ " + e;
      li.className = "unlocked";
    } else {
      li.textContent = "◇ ???";
      li.className = "locked";
    }
    list.appendChild(li);
  });
  document.getElementById("progress").textContent = "进度：" + unlocked.length + " / " + allEndings.length;
}

function saveProgress(nodeId) {
  localStorage.setItem("currentNode", nodeId);
  localStorage.setItem("saveTime", new Date().toLocaleString());
}

function loadProgress() {
  return localStorage.getItem("currentNode");
}

function showNode(id) {
  let node = story[id];
  if (!node) return;
  if (node.onEnter) {
    let next = node.onEnter();
    if (next) { showNode(next); return; }
  }
  saveProgress(id);
  let imgBox = document.getElementById("image-box");
  if (node.image) {
    imgBox.innerHTML = '<img src="' + node.image + '" onerror="this.style.display=\'none\'">';
  } else {
    imgBox.innerHTML = "";
  }
  document.getElementById("text").innerText = node.text;
  document.getElementById("choices").innerHTML = "";
  document.getElementById("ending").innerHTML = "";
  document.getElementById("entry").innerHTML = "";
  if (node.ending) {
    document.getElementById("ending").innerHTML = "结局：" + node.ending;
    unlockEnding(node.ending);
    showAchievements();
  } else if (node.choices) {
    node.choices.forEach(c => {
      let btn = document.createElement("button");
      btn.textContent = c.label;
      btn.onclick = () => showNode(c.next);
      document.getElementById("choices").appendChild(btn);
    });
  }
}

function goEntry() {
  document.getElementById("text").innerText = "";
  document.getElementById("choices").innerHTML = "";
  document.getElementById("ending").innerHTML = "";
  document.getElementById("image-box").innerHTML = "";
  let entry = document.getElementById("entry");
  entry.innerHTML = "";
  let btn1 = document.createElement("button");
  btn1.textContent = "法军：随军画师";
  btn1.onclick = () => showNode("painter_start");
  entry.appendChild(btn1);
  let btn2 = document.createElement("button");
  btn2.textContent = "俄军：总指挥彼得罗夫将军";
  btn2.onclick = () => showNode("russian_start");
  entry.appendChild(btn2);
  let btn3 = document.createElement("button");
  btn3.textContent = "起义军：木匠格里戈里";
  btn3.onclick = () => showNode("start");
  entry.appendChild(btn3);
  let saved = loadProgress();
  if (saved) {
    let btnContinue = document.createElement("button");
    btnContinue.textContent = "继续上次进度";
    btnContinue.onclick = () => showNode(saved);
    entry.appendChild(btnContinue);
  }
  document.getElementById("save-status").textContent = saved ? "上次存档：" + localStorage.getItem("saveTime") : "无存档";
}

function clearAllSave() {
  if (confirm("确定要清除所有进度和成就吗？此操作不可恢复。")) {
    localStorage.removeItem("achievements");
    localStorage.removeItem("currentNode");
    localStorage.removeItem("saveTime");
    goEntry();
    showAchievements();
    document.getElementById("save-status").textContent = "已清除所有进度";
  }
}

goEntry();
showAchievements();
</script>
</body>
</html>
